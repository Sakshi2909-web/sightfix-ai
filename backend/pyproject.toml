[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sightfix-backend"
version = "0.1.0"
description = "SightFix AI - Multimodal Bug Understanding & Repair Intelligence Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "rank-bm25>=0.2.2",
    "GitPython>=3.1.42",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pillow>=10.2.0",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
