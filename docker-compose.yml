version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sightfix-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sightfix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sightfix}
      POSTGRES_DB: ${POSTGRES_DB:-sightfix}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sightfix"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sightfix-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: sightfix-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sightfix-api
    restart: always
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - data_storage:/data
    environment:
      - DATABASE_URL=postgresql+psycopg://sightfix:sightfix@postgres:5432/sightfix
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - STORAGE_DIR=/data
      - VLM_PROVIDER=${VLM_PROVIDER:-mock}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-mock}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SANDBOX_TIMEOUT_SEC=${SANDBOX_TIMEOUT_SEC:-180}
      - SANDBOX_MEM_MB=${SANDBOX_MEM_MB:-2048}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-50}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sightfix-worker
    restart: always
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    volumes:
      - ./backend:/app
      - data_storage:/data
      # Security note: Host docker socket access allows running isolated sandboxes.
      # In production, use rootless Docker, gVisor, or Firecracker microVMs.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DATABASE_URL=postgresql+psycopg://sightfix:sightfix@postgres:5432/sightfix
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - STORAGE_DIR=/data
      - VLM_PROVIDER=${VLM_PROVIDER:-mock}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-mock}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SANDBOX_TIMEOUT_SEC=${SANDBOX_TIMEOUT_SEC:-180}
      - SANDBOX_MEM_MB=${SANDBOX_MEM_MB:-2048}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sightfix-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  data_storage:
