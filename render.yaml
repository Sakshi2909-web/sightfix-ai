services:
  - type: web
    name: sightfix-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && pip install -e . && python app/seed.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:///./sightfix.db
      - key: VLM_PROVIDER
        value: mock
      - key: LLM_PROVIDER
        value: mock
      - key: EMBEDDING_PROVIDER
        value: mock
      - key: STORAGE_DIR
        value: /tmp/sightfix_data
